services:
  postgres:
    image: postgres:16-alpine
    container_name: mygamatotor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mygamatotor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mygamatotor}
      POSTGRES_DB: ${POSTGRES_DB:-mygamatotor}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mygamatotor} -d ${POSTGRES_DB:-mygamatotor}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile.dev
    container_name: mygamatotor-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DIRECT_URL: postgresql://${POSTGRES_USER:-mygamatotor}:${POSTGRES_PASSWORD:-mygamatotor}@postgres:5432/${POSTGRES_DB:-mygamatotor}?schema=public
      DATABASE_URL: postgresql://${POSTGRES_USER:-mygamatotor}:${POSTGRES_PASSWORD:-mygamatotor}@postgres:5432/${POSTGRES_DB:-mygamatotor}?schema=public
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      PORT: 3000
      NODE_ENV: development
    ports:
      - "3000:3000"
    volumes:
      - ./apps/backend/src:/app/apps/backend/src
      - ./apps/backend/prisma:/app/apps/backend/prisma
      - ./packages/shared/src:/app/packages/shared/src

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile.dev
    container_name: mygamatotor-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:5173"
    volumes:
      - ./apps/frontend/src:/app/apps/frontend/src
      - ./apps/frontend/public:/app/apps/frontend/public
      - ./apps/frontend/index.html:/app/apps/frontend/index.html
      - ./packages/shared/src:/app/packages/shared/src

volumes:
  postgres-data:
